# Default: ONE free web service running the API plus a single embedded worker that
# consumes every queue (render_entrypoint.sh). Simple, but the API and the worker
# share one process tree and one local disk.
#
# To scale, move to separate services (paid plans: background workers) and switch
# STORAGE_BACKEND to s3 -- see docs/deployment.md for the full split topology.
services:
  - type: web
    name: scrybe-api
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./render_entrypoint.sh
    healthCheckPath: /health   # liveness only; never depends on YouTube/Redis
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: YOUTUBE_MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: YOUTUBE_MIN_REQUEST_DELAY
        value: "5"
      - key: BGUTIL_BASE_URL
        sync: false   # set when a bgutil provider service is deployed

