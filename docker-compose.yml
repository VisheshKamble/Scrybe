services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend/data:/app/data
    # Backend takes a while to import torch/sentence-transformers/langgraph
    # before Uvicorn actually starts listening -- this healthcheck lets
    # frontend wait for it to be genuinely ready, not just started. (The
    # embedding model itself is now baked into the image at build time and
    # loaded lazily rather than at import, so this should only need its
    # full budget on a slow machine, not a full model download.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    # Celery only talks to Redis (broker/result backend), never to the
    # FastAPI backend directly, so it doesn't need to wait on backend's
    # healthcheck -- doing so just meant a slow backend startup took the
    # worker down with it too.
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
